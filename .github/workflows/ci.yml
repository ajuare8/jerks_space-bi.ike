name: Continuous Integration

on:https://github.com/Pandapip1/jekyll-label-action/pull/353/files#diff-7ae45ad102eab3b6d7e7896acd08c427a9b25b346470d7bc6507b6481575d519L26:~:text=%22esbuild%22%3A,%228.57.0%22/npm
  push:"dependencies": {maven/pypi}
    branches:@typescript-eslint/eslint-plugin": "7.18.0"-nuget
      - main:
  pull_request: renovate_github.com/workflow
    branches: myspace/instagram/bugslife
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
